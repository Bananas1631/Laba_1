# Бэклог проекта АС «Репетитор.Просто», составленный по ТЗ (ГОСТ 34.602-89).
# Структура: веха (стадия календарного плана, разд. 5 ТЗ) → эпик → задача → подзадачи (чек-лист).
# По этому файлу скрипт scripts/create_backlog.py создаёт метки, вехи и Issues в GitHub.

team:
  Шаталин: "А.А. Шаталин"
  Валитов: "Т.В. Валитов"
  Любченко: "М.Д. Любченко"

labels:
  - {name: "эпик", color: "6f42c1", description: "Крупная задача, объединяющая связанные задачи"}
  - {name: "задача", color: "0e8a16", description: "Задача внутри эпика"}
  - {name: "документация", color: "0075ca", description: "Документы по ГОСТ, описания, руководства"}
  - {name: "архитектура", color: "5319e7", description: "Проектирование модулей, БД, API"}
  - {name: "backend", color: "1d76db", description: "Серверная часть"}
  - {name: "frontend", color: "c5def5", description: "Веб-интерфейс и мобильные приложения"}
  - {name: "интеграция", color: "fbca04", description: "Внешние сервисы: ЮKassa, Телемост, календари, SMS, YandexGPT"}
  - {name: "тестирование", color: "d93f0b", description: "Автотесты, испытания, приёмка"}
  - {name: "инфраструктура", color: "bfdadc", description: "CI/CD, облако, мониторинг, резервное копирование"}
  - {name: "безопасность", color: "b60205", description: "Защита данных и разграничение доступа"}
  - {name: "приоритет: высокий", color: "e11d21", description: "Нужно для MVP"}
  - {name: "приоритет: средний", color: "f9a825", description: "Важно, но не блокирует MVP"}
  - {name: "приоритет: низкий", color: "c2e0c6", description: "Можно отложить"}
  - {name: "исп: Шаталин", color: "fef2c0", description: "Ответственный — А.А. Шаталин"}
  - {name: "исп: Валитов", color: "d4c5f9", description: "Ответственный — Т.В. Валитов"}
  - {name: "исп: Любченко", color: "bfd4f2", description: "Ответственный — М.Д. Любченко"}

milestones:
  - key: s1
    title: "1. Предпроектная стадия"
    due: "2026-03-11"
    description: "Выбор и анализ предметной области, разработка и утверждение ТЗ. Результат: утверждённое ТЗ, отчёт по анализу предметной области."
  - key: s2
    title: "2. Стадия разработки"
    due: "2026-05-06"
    description: "Эскизное и техническое проектирование (архитектура, БД), программная реализация подсистем. Результат: рабочий прототип системы, исходный код."
  - key: s3
    title: "3. Тестирование и сдача проекта"
    due: "2026-05-28"
    description: "Тестирование и исправление ошибок, подготовка документации и защита проекта. Результат: рабочая версия, документация, защита."

epics:
  # ---------------------------------------------------------------- стадия 1
  - key: E1
    title: "Эпик: Предпроектная стадия — анализ предметной области и ТЗ"
    milestone: s1
    labels: ["документация", "приоритет: высокий"]
    owner: Шаталин
    tz: "разд. 5, этап 1"
    description: "Выбор и анализ предметной области программной системы, разработка и утверждение ТЗ на АС «Репетитор.Просто» по ГОСТ 34.602-89."
    tasks:
      - title: "Анализ предметной области peer-to-peer репетиторства"
        labels: ["документация"]
        owner: Валитов
        tz: "разд. 2, 3"
        done: true
        description: "Описать объект автоматизации, участников процесса (Репетитор, Ученик, Родитель, Гость, Администратор), текущий процесс и его проблемы."
        subtasks:
          - "Описать участников и их роли"
          - "Описать текущий процесс взаимодействия (поиск, согласование, оплата, занятие, обратная связь)"
          - "Зафиксировать ограничение: только формат «один на один»"
          - "Сформулировать цели и критерии их достижения"
        acceptance: "Разделы 2–3 ТЗ заполнены и согласованы с заказчиком."
      - title: "Разработка и утверждение ТЗ по ГОСТ 34.602-89"
        labels: ["документация"]
        owner: Шаталин
        tz: "разд. 1–9"
        done: true
        description: "Подготовить техническое задание со всеми разделами ГОСТ 34.602-89 и загрузить его в репозиторий (docs/)."
        subtasks:
          - "Заполнить общие сведения, назначение и цели"
          - "Описать требования к системе, функциям и видам обеспечения"
          - "Составить календарный план, порядок контроля и приёмки"
          - "Оформить по ГОСТ 2.105-95 и ГОСТ 7.32-2017"
          - "Загрузить ТЗ в репозиторий: docs/ТЗ_ГОСТ_34.602-89_Репетитор.Просто.docx"
        acceptance: "ТЗ утверждено (действует с 11.03.2026) и лежит в репозитории."

  # ---------------------------------------------------------------- стадия 2
  - key: E2
    title: "Эпик: Проектирование архитектуры и базы данных"
    milestone: s2
    labels: ["архитектура", "приоритет: высокий"]
    owner: Шаталин
    tz: "разд. 4.1.1, 4.3.1, 4.3.2, 5 (этап 2.1)"
    description: "Эскизное и техническое проектирование: модули системы, их взаимодействие, структура данных, API, настройка репозитория и CI."
    tasks:
      - title: "Диаграмма контекста системы (C4, уровень 1)"
        labels: ["архитектура", "документация"]
        owner: Шаталин
        tz: "разд. 3.2, 4.3.1"
        done: true
        description: "Показать систему, роли пользователей и внешние сервисы (ЮKassa, Яндекс Телемост, Яндекс.Календарь, SMS Aero, YandexGPT, Yandex Object Storage)."
        subtasks:
          - "Определить роли пользователей"
          - "Перечислить внешние интеграции из табл. 1 ТЗ"
          - "Нарисовать диаграмму в Mermaid (docs/architecture/README.md)"
        acceptance: "Диаграмма отображается в GitHub и соответствует ТЗ."
      - title: "Диаграмма контейнеров и модулей (C4, уровень 2)"
        labels: ["архитектура", "документация"]
        owner: Шаталин
        tz: "разд. 4.1.1, 4.3.1"
        done: true
        description: "Разбить систему на контейнеры (веб-клиент, мобильное приложение, API, WebSocket-сервер, БД, хранилище файлов) и модули-подсистемы; описать их взаимодействие."
        subtasks:
          - "Выделить контейнеры и технологии"
          - "Выделить модули по подсистемам ТЗ (п. 4.2.1)"
          - "Описать связи: REST/JSON, WebSocket, HTTPS"
          - "Составить таблицу «модуль — назначение — связи»"
        acceptance: "Диаграмма и таблица модулей лежат в docs/architecture/README.md."
      - title: "Глоссарий терминов предметной области"
        labels: ["документация"]
        owner: Валитов
        tz: "разд. 4.3.2"
        done: true
        description: "ТЗ требует глоссарий как средство описания предметной области."
        subtasks:
          - "Выписать термины из ТЗ"
          - "Дать определения"
          - "Опубликовать docs/glossary.md"
        acceptance: "Глоссарий опубликован и используется в документации."
      - title: "Настройка репозитория, шаблонов задач и CI (GitHub Actions)"
        labels: ["инфраструктура", "тестирование"]
        owner: Шаталин
        tz: "разд. 6 (альфа-тестирование), 4.1.6"
        done: true
        description: "Подготовить репозиторий к командной работе: README, шаблоны Issues и Pull Request, workflow автоматического запуска тестов на каждый push и pull request."
        subtasks:
          - "README с описанием проекта и порядком работы"
          - "Шаблоны Issue (эпик, задача, ошибка) и Pull Request"
          - "Workflow .github/workflows/ci.yml (pytest)"
          - "Первый успешный прогон CI"
        acceptance: "CI запускается автоматически и проходит успешно."
      - title: "ER-диаграмма и схема БД PostgreSQL (3НФ)"
        labels: ["архитектура", "backend"]
        owner: Валитов
        tz: "разд. 4.3.1"
        description: "Спроектировать реляционную модель, нормализованную до 3НФ, с поддержкой ACID-транзакций и JSONB."
        subtasks:
          - "Сущности: User, TutorProfile, Child, AvailabilitySlot, Booking, Payment, Lesson, Homework, Review, Notification"
          - "Связи и ограничения целостности"
          - "ER-диаграмма в Mermaid"
          - "Миграции начальной схемы"
        acceptance: "Схема в 3НФ, миграции применяются на чистую БД."
      - title: "Спецификация REST API (OpenAPI) и событий WebSocket"
        labels: ["архитектура", "backend"]
        owner: Шаталин
        tz: "разд. 4.2.1, 4.3.1"
        description: "Описать эндпоинты всех подсистем (вход/выход по п. 4.2.1) и события реального времени (чат, уведомления)."
        subtasks:
          - "openapi.yaml для подсистем"
          - "Формат ошибок и аутентификация (токен)"
          - "Список WebSocket-событий"
        acceptance: "Спецификация проходит валидацию и согласована командой."

  - key: E3
    title: "Эпик: Подсистема управления пользователями"
    milestone: s2
    labels: ["backend", "безопасность", "приоритет: высокий"]
    owner: Валитов
    tz: "разд. 4.1.1, 4.1.7, 4.2.1"
    description: "Регистрация, аутентификация, роли (Гость, Ученик, Родитель, Репетитор, Администратор), личные кабинеты, верификация репетиторов, защита персональных данных."
    tasks:
      - title: "Регистрация пользователя"
        labels: ["backend"]
        owner: Валитов
        tz: "разд. 4.2.1"
        description: "Вход: email, телефон, пароль, роль. Выход: подтверждение регистрации и созданный профиль."
        subtasks:
          - "Валидация email, телефона, пароля"
          - "Подтверждение email/телефона"
          - "Создание профиля по роли"
          - "Unit-тесты"
        acceptance: "Пользователь каждой роли регистрируется, дубликаты email/телефона отклоняются."
      - title: "Аутентификация и выдача токена доступа"
        labels: ["backend", "безопасность"]
        owner: Валитов
        tz: "разд. 4.2.1"
        description: "Вход: логин и пароль. Выход: токен доступа и основные данные профиля."
        subtasks:
          - "Хеширование паролей"
          - "Выдача и обновление токенов"
          - "Выход из системы"
          - "Unit-тесты"
        acceptance: "Неверный пароль не даёт токен; токен истекает по времени."
      - title: "Разграничение прав доступа по ролям (RBAC)"
        labels: ["backend", "безопасность"]
        owner: Валитов
        tz: "разд. 4.1.7"
        description: "Права Гостя, Ученика, Родителя, Репетитора и Администратора на разделы и операции."
        subtasks:
          - "Матрица прав «роль — операция»"
          - "Проверка прав на каждом эндпоинте"
          - "Тесты отказа в доступе"
        acceptance: "Операции без нужной роли возвращают отказ."
      - title: "Личный кабинет ученика и родителя"
        labels: ["backend", "frontend"]
        owner: Любченко
        tz: "разд. 4.1.1"
        description: "Редактирование данных, привязка детей, история занятий, настройки уведомлений."
        subtasks:
          - "Редактирование профиля"
          - "Привязка аккаунта ребёнка к родителю"
          - "История занятий"
          - "Настройки уведомлений"
        acceptance: "Родитель видит занятия и платежи привязанных детей."
      - title: "Анкета репетитора и загрузка документов верификации"
        labels: ["backend", "frontend"]
        owner: Валитов
        tz: "разд. 4.1.1, 7"
        description: "Расширенная анкета (образование, опыт, предметы, цена), документы для верификации, управление видимостью профиля."
        subtasks:
          - "Форма анкеты"
          - "Загрузка документов в Object Storage"
          - "Статус верификации"
          - "Скрытие/показ профиля в каталоге"
        acceptance: "Непроверенный репетитор не виден в каталоге."
      - title: "Шифрование персональных данных и HTTPS"
        labels: ["безопасность", "инфраструктура"]
        owner: Шаталин
        tz: "разд. 3.2, 4.1.5, 4.1.7"
        description: "Передача данных только по HTTPS, шифрование персональных данных в БД (152-ФЗ)."
        subtasks:
          - "TLS-сертификат и редирект на HTTPS"
          - "Шифрование чувствительных полей"
          - "Согласие на обработку ПДн при регистрации"
        acceptance: "Персональные данные не хранятся в открытом виде."

  - key: E4
    title: "Эпик: Подсистема поиска и подбора репетиторов"
    milestone: s2
    labels: ["backend", "frontend", "приоритет: высокий"]
    owner: Валитов
    tz: "разд. 4.1.1, 4.2.1–4.2.3"
    description: "Каталог анкет, поиск с фильтрами, ранжирование, просмотр профиля репетитора."
    tasks:
      - title: "Поиск репетиторов с фильтрами и ранжированием"
        labels: ["backend"]
        owner: Валитов
        tz: "разд. 4.2.1, 4.2.2, 4.2.3"
        description: "Вход: предмет, диапазон цены, минимальный рейтинг, свободные слоты. Выход: ранжированный список анкет. Отклик ≤ 3 с, точность релевантности ≥ 85 %."
        subtasks:
          - "Фильтры по предмету, цене, рейтингу, слотам"
          - "Алгоритм ранжирования"
          - "Индексы БД под поиск"
          - "Тест производительности (≤ 3 с)"
        acceptance: "Поиск возвращает подходящие анкеты за ≤ 3 с."
      - title: "Страница профиля репетитора"
        labels: ["backend", "frontend"]
        owner: Любченко
        tz: "разд. 4.2.1"
        description: "По идентификатору возвращается полная информация: образование, опыт, предметы, отзывы, свободные слоты."
        subtasks:
          - "API получения профиля"
          - "Вёрстка страницы"
          - "Блок отзывов"
        acceptance: "Гость и ученик видят профиль и могут перейти к бронированию."
      - title: "Главный раздел: каталог, строка поиска и блоки преимуществ"
        labels: ["frontend"]
        owner: Любченко
        tz: "разд. 4.1.1"
        description: "Центральная страница: строка поиска, фильтры, сетка анкет, информационные блоки."
        subtasks:
          - "Сетка карточек анкет"
          - "Панель фильтров"
          - "Блоки о преимуществах платформы"
        acceptance: "Страница доступна Гостю без регистрации."

  - key: E5
    title: "Эпик: Подсистема расписания и бронирования"
    milestone: s2
    labels: ["backend", "приоритет: высокий"]
    owner: Шаталин
    tz: "разд. 4.1.1, 4.2.1, 4.2.2, 2.2 (критерий 2)"
    description: "Сетка доступных слотов репетитора, бронирование с блокировкой слота при конкурентном доступе, отмена и синхронизация с внешними календарями."
    tasks:
      - title: "Календарь доступных слотов репетитора (AvailabilitySlot)"
        labels: ["backend", "frontend"]
        owner: Шаталин
        tz: "разд. 4.1.1, 7"
        description: "Репетитор создаёт сетку слотов; ученик видит свободные окна и свои занятия."
        subtasks:
          - "CRUD слотов"
          - "Повторяющиеся слоты (каждую неделю)"
          - "Календарь в интерфейсе для обеих ролей"
        acceptance: "Слоты не пересекаются, ученик видит только свободные."
      - title: "Бронирование слота с блокировкой при конкурентном доступе"
        labels: ["backend", "тестирование"]
        owner: Шаталин
        tz: "разд. 4.2.1, 4.2.2, 2.2"
        description: "Вход: id слота и id ученика. Выход: подтверждение бронирования со статусом оплаты. Слот блокируется для других; операция ≤ 2 с."
        subtasks:
          - "[x] Прототип логики бронирования с блокировкой (backend/booking)"
          - "[x] Unit-тесты, в т. ч. одновременное бронирование из нескольких потоков"
          - "Блокировка на уровне БД (транзакция, SELECT … FOR UPDATE)"
          - "Связка с эскроу-оплатой"
          - "Тест времени операции (≤ 2 с)"
        acceptance: "При одновременных запросах слот получает ровно один ученик."
      - title: "Отмена бронирования и запуск возврата средств"
        labels: ["backend"]
        owner: Шаталин
        tz: "разд. 4.2.1"
        description: "Вход: id бронирования и причина. Выход: статус отмены; инициируется возврат средств."
        subtasks:
          - "[x] Прототип отмены с освобождением слота"
          - "Правила возврата в зависимости от срока отмены"
          - "Вызов подсистемы оплаты"
          - "Уведомление второй стороны"
        acceptance: "После отмены слот снова свободен, возврат создан."
      - title: "Интеграция с Яндекс.Календарём (CalDAV / iCal)"
        labels: ["интеграция"]
        owner: Валитов
        tz: "разд. 3.2, 4.3.1"
        description: "Выгрузка забронированных занятий во внешний календарь пользователя."
        subtasks:
          - "Экспорт iCal-ленты"
          - "Синхронизация по CalDAV"
        acceptance: "Занятие появляется во внешнем календаре после бронирования."

  - key: E6
    title: "Эпик: Подсистема оплаты (эскроу)"
    milestone: s2
    labels: ["backend", "интеграция", "приоритет: высокий"]
    owner: Шаталин
    tz: "разд. 4.1.1, 4.2.1–4.2.3"
    description: "Оплата через эскроу-счёт ЮKassa, выплата репетитору после занятия, возвраты, раздел «Финансы»."
    tasks:
      - title: "Интеграция с платёжным шлюзом ЮKassa"
        labels: ["интеграция", "backend"]
        owner: Шаталин
        tz: "разд. 3.2, 4.3.3"
        description: "Создание платежа, обработка уведомлений (webhook) о статусе. Транзакция ≤ 10 с."
        subtasks:
          - "Подключение SDK ЮKassa (тестовый магазин)"
          - "Обработка webhook"
          - "Идемпотентность платежей"
        acceptance: "Тестовый платёж проходит полный цикл за ≤ 10 с."
      - title: "Эскроу: заморозка и выплата средств"
        labels: ["backend"]
        owner: Шаталин
        tz: "разд. 4.2.1, 4.2.3"
        description: "Вход: платёжные данные и сумма. Выход: статус «заморожено» / «выплачено». Без критических ошибок в финансовых операциях."
        subtasks:
          - "Модель статусов транзакции"
          - "Выплата после проведённого занятия"
